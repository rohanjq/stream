<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTCUSDT 5m · EMA overlay</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--page);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
    }
    .viz-root {
      color-scheme: light;
      --page:           #f9f9f7;
      --surface-1:      #fcfcfb;
      --text-primary:   #0b0b0b;
      --text-secondary: #52514e;
      --muted:          #898781;
      --gridline:       #e1e0d9;
      --baseline:       #c3c2b7;
      --up:             #0ca30c;
      --down:           #d03b3b;
      --ema-5:          #2a78d6; /* blue */
      --ema-9:          #eb6834; /* orange */
      --ema-21:         #e87ba4; /* magenta */
      --ema-50:         #4a3aa7; /* violet */
      --ema-200:        #eda100; /* yellow */
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) .viz-root {
        color-scheme: dark;
        --page:           #0d0d0d;
        --surface-1:      #1a1a19;
        --text-primary:   #ffffff;
        --text-secondary: #c3c2b7;
        --muted:          #898781;
        --gridline:       #2c2c2a;
        --baseline:       #383835;
        --up:             #0ca30c;
        --down:           #e66767;
        --ema-5:          #3987e5;
        --ema-9:          #d95926;
        --ema-21:         #d55181;
        --ema-50:         #9085e9;
        --ema-200:        #c98500;
      }
    }
    header {
      padding: 14px 20px 10px;
      border-bottom: 1px solid var(--gridline);
      background: var(--surface-1);
    }
    h1 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
    .sub { font-size: 12px; color: var(--text-secondary); margin: 0; }
    #legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 2px; border-radius: 1px; display: inline-block; }
    .val { color: var(--text-primary); font-variant-numeric: tabular-nums; }
    #chart { flex: 1 1 auto; min-height: 0; }
  </style>
</head>
<body class="viz-root">
  <header>
    <h1>BTCUSDT · 5-minute candles with EMA overlay</h1>
    <p class="sub">EMAs (5, 9, 21, 50, 200) computed in-browser from Binance 5m OHLC. Hover for values.</p>
    <div id="legend"></div>
  </header>
  <div id="chart"></div>

  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
